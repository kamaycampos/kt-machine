# THE WEEKLY PLANNER'S DOOR - 22 Sept 2026.
# The weekly cloud agent (factory/PLANNING.md) pushes its clip plans to a claude/* branch.
# This job takes ONLY new plan files (and an extended month list) from that branch,
# checks them, commits them to main and starts the factory. Anything else the agent
# changed is ignored, so a planning mistake can never touch the posting machine.
name: plans-merge
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
  actions: write
concurrency:
  group: plans-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Take the new plans, check them, commit to main
        env: { GH_TOKEN: "${{ github.token }}", BR: "${{ github.ref_name }}", HOOK_STAKES: warn }
        run: |
          pip install -q pillow numpy opencv-python-headless
          mkdir -p ~/Kamay/bin && cp -r factory/assets/* ~/Kamay/bin/ 2>/dev/null || true
          git config user.name "kt-planner"
          git config user.email "kt-planner@users.noreply.github.com"
          # A planner that pushes three times in a minute queues three merges; the first
          # one merges and deletes the branch. The later ones have nothing left to do -
          # that is not a failure (13 Oct 2026: a "Run failed" email for exactly this).
          git fetch -q origin "$BR" || { echo "branch $BR already merged and deleted"; exit 0; }
          NEW=$(git diff --name-only --diff-filter=A main..."origin/$BR" -- 'factory/plans/ep_*.json' 'factory/plans/ar_*.json')
          echo "agent changed: $(git diff --name-only main...origin/$BR | tr '\n' ' ')"
          OK=""
          for f in $NEW; do
            git show "origin/$BR:$f" > "$f"
            if python factory/check_plan.py "$f"; then OK="$OK $f"; else echo "REJECTED $f"; rm "$f"; fi
          done
          # THE STRATEGIST'S ORDERS (17 Oct 2026). The growth-strategist routine rewrites
          # factory/STRATEGY.md daily; the planner reads it first. Only that one file is taken.
          if git diff --name-only main...origin/$BR | grep -qx factory/STRATEGY.md; then
            git show "origin/$BR:factory/STRATEGY.md" > factory/STRATEGY.md && OK="$OK factory/STRATEGY.md"
          fi
          # THE FREE CALL DATE (10 Nov 2026). The strategist reads freecallwithkevin.com daily and
          # dates the 'free_call' line. Only that one item is taken; every other link line stays main's.
          if git diff --name-only main...origin/$BR | grep -qx state/extra_links.json; then
            git show "origin/$BR:state/extra_links.json" > /tmp/el.json
            if python - <<'PY'
          import json, re, sys
          new = json.load(open("/tmp/el.json")); cur = json.load(open("state/extra_links.json"))
          item = next((i for i in new.get("dated", []) if i.get("name") == "free_call"), None)
          ok = lambda d: d is None or re.fullmatch(r"\d{4}-\d{2}-\d{2}", d)
          if not item or not ok(item.get("from")) or not ok(item.get("until")) or len(item.get("when") or "") > 60:
              sys.exit(1)
          for i in cur.get("dated", []):
              if i.get("name") == "free_call":
                  i.update({k: item.get(k) for k in ("when", "from", "until")})
          json.dump(cur, open("state/extra_links.json", "w"), indent=1, ensure_ascii=False)
          PY
            then OK="$OK state/extra_links.json"; else echo "REJECTED free_call date"; fi
          fi
          for SP in factory/source_plan.json factory/ar_source_plan.json; do
            git diff --name-only main...origin/$BR | grep -qx "$SP" || continue
            git show "origin/$BR:$SP" > /tmp/sp.json
            if python factory/append_only.py "$SP" /tmp/sp.json; then
              cp /tmp/sp.json "$SP"; OK="$OK $SP"
            else
              echo "REJECTED $SP"
            fi
          done
          [ -z "$OK" ] && { echo "nothing to merge"; git push -q origin --delete "$BR" || true; exit 0; }
          git add $OK
          git commit -q -m "weekly plans from $BR:$OK"
          bash factory/save_state.sh
          echo "$OK" | grep -q "factory/plans/" && gh workflow run factory.yml --ref main
          git push -q origin --delete "$BR" || true
