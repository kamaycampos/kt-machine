# THE WEEKLY PLANNER'S DOOR - 22 Sept 2026.
# The weekly cloud agent (factory/PLANNING.md) pushes its clip plans to a claude/* branch.
# This job takes ONLY new plan files (and an extended month list) from that branch,
# checks them, commits them to main and starts the factory. Anything else the agent
# changed is ignored, so a planning mistake can never touch the posting machine.
name: plans-merge
on:
  push:
    branches: ["claude/**"]
permissions:
  contents: write
  actions: write
concurrency:
  group: plans-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Take the new plans, check them, commit to main
        env: { GH_TOKEN: "${{ github.token }}", BR: "${{ github.ref_name }}" }
        run: |
          pip install -q pillow numpy opencv-python-headless
          mkdir -p ~/Kamay/bin && cp -r factory/assets/* ~/Kamay/bin/ 2>/dev/null || true
          git config user.name "kt-planner"
          git config user.email "kt-planner@users.noreply.github.com"
          git fetch -q origin "$BR"
          NEW=$(git diff --name-only --diff-filter=A main..."origin/$BR" -- 'factory/plans/ep_*.json')
          echo "agent changed: $(git diff --name-only main...origin/$BR | tr '\n' ' ')"
          OK=""
          for f in $NEW; do
            git show "origin/$BR:$f" > "$f"
            if python factory/check_plan.py "$f"; then OK="$OK $f"; else echo "REJECTED $f"; rm "$f"; fi
          done
          if git diff --name-only main...origin/$BR | grep -qx factory/source_plan.json; then
            git show "origin/$BR:factory/source_plan.json" > /tmp/sp.json
            python - <<'EOF' && cp /tmp/sp.json factory/source_plan.json && OK="$OK factory/source_plan.json"
          import json, sys
          old = [e["id"] for e in json.load(open("factory/source_plan.json"))["episodes"]]
          new = [e["id"] for e in json.load(open("/tmp/sp.json"))["episodes"]]
          sys.exit(0 if new[:len(old)] == old and len(new) > len(old) else 1)   # append-only
          EOF
          fi
          [ -z "$OK" ] && { echo "nothing to merge"; exit 0; }
          git add $OK
          git commit -q -m "weekly plans from $BR:$OK"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          gh workflow run factory.yml --ref main
          git push -q origin --delete "$BR" || true
