# READ-ONLY (16 Nov 2026): the app, permissions and subscriptions behind KT's Meta keys - what
# Meta's instant comment push would need. Prints no key, sends nothing.
name: hook-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests && python dm/hook_diag.py
