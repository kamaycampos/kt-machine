# Can a GitHub server fetch Kevin's videos from YouTube in 1080p? (19 Sept 2026)
# The cloud clip factory depends entirely on this answer. Manual trigger only.
name: factory-test
on: workflow_dispatch
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Try a 30-second 1080p download
        run: |
          pip install -q -U yt-dlp
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null
          yt-dlp --version
          yt-dlp --no-warnings -F "https://www.youtube.com/watch?v=bCIrExQ0gPQ" 2>&1 | grep -E "1080|ERROR|Sign in|bot" | head -8 || true
          yt-dlp --no-warnings -f "bv*[height=1080][protocol*=m3u8]+ba/bv*[height=1080]+ba" --download-sections "*300-330" -o test.mp4 "https://www.youtube.com/watch?v=bCIrExQ0gPQ" 2>&1 | tail -3
          ls -la test.mp4 && ffprobe -v error -show_entries stream=width,height -of csv=p=0 test.mp4 && echo "FACTORY-FETCH: WORKS" || echo "FACTORY-FETCH: BLOCKED"
