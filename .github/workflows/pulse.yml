# THE HEARTBEAT (Kamay approved, 6 Oct 2026). post.yml asks for "*/20 * * * *", and
# GitHub ran it at 15:12, 22:01, 02:18, 09:05, 15:57 - every 6-7 hours, not every 20
# minutes. GitHub's cron is best-effort and starves on busy hours, so a slot waited
# until whenever the next run landed, and a clip queued at 16:41 sat unscheduled into
# the night. Both accounts posted at a fraction of their grid.
#
# A job that is already running is not throttled. This one starts post.yml every
# 20 minutes for ~5h40m, then starts itself again before GitHub's 6-hour job limit.
# A dispatch made with GITHUB_TOKEN does start a run (workflow_dispatch is the
# exception to the no-recursion rule). post.yml keeps its own cron as the fallback
# and its own concurrency lock, so a pulse and a cron run never publish together.
# Free: public repository, and the job only sleeps. To stop it: disable this
# workflow in Actions -> pulse -> "..." -> Disable workflow.
name: pulse
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"        # restarts the heartbeat if a chain ever breaks
permissions:
  actions: write
  contents: write                 # the DM pass commits state/dms.json
concurrency:
  group: pulse
  cancel-in-progress: false       # a second pulse waits; it never runs beside one
jobs:
  beat:
    if: github.repository != 'kamaycampos/affiliate-factory'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # COMMENT -> DM IN 2-3 MINUTES (14 Oct 2026, Kamay: "answer in 2-3 minutes
      # instead of ~20"). The DM pass moved here from post.yml: it runs every 150 s
      # between post dispatches. This job is the ONLY writer of state/dms.json, so two
      # passes can never read the same comment as new and DM one person twice.
      DM_AUTO: ${{ vars.DM_AUTO }}
      DM_TEXT: ${{ vars.DM_TEXT }}
      DM_DIAG: ${{ vars.DM_DIAG }}
      OFFER_URL: ${{ secrets.OFFER_URL }}
      KT_CTA_KEYWORDS: ${{ secrets.KT_CTA_KEYWORDS }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      FB_POST_PAGE_ID: ${{ secrets.FB_POST_PAGE_ID }}
      FB_POST_ACCESS_TOKEN: ${{ secrets.FB_POST_ACCESS_TOKEN }}
      # Awakened Rise (2 Nov 2026): the same bot on her keys, her words, her link.
      AR_DM_TEXT: ${{ vars.AR_DM_TEXT }}
      AR_OFFER_URL: ${{ secrets.AR_OFFER_URL }}
      AR_CTA_KEYWORDS: ${{ secrets.AR_CTA_KEYWORDS }}
      AR_IG_USER_ID: ${{ secrets.AR_IG_USER_ID }}
      AR_IG_ACCESS_TOKEN: ${{ secrets.AR_IG_ACCESS_TOKEN }}
      AR_FB_PAGE_ID: ${{ secrets.AR_FB_PAGE_ID }}
      AR_FB_ACCESS_TOKEN: ${{ secrets.AR_FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Start post.yml every 20 minutes, answer keyword comments every 5 seconds
        run: |
          git config user.name  "kt-machine"
          git config user.email "noreply@github.com"
          dm_pass() {   # $1 = how many recent posts to read
            git pull -q --rebase --autostash || git rebase --abort 2>/dev/null || true
            DM_RECENT_POSTS=$1 timeout 240 python dm/dm_reply.py || echo "DM pass failed - next in 150 s"
            DM_BRAND=AR_ DM_RECENT_POSTS=$1 timeout 240 python dm/dm_reply.py || echo "AR DM pass failed - next in 150 s"
            git add state/dms.json 2>/dev/null || true
            git add state/dms_ar.json 2>/dev/null || true
            git diff --staged --quiet && return 0
            git commit -q -m "dms: $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git pull -q --rebase --autostash && git push -q && return 0
              git rebase --abort 2>/dev/null || true; sleep 3
            done
            echo "::warning::dms.json push failed - sent DMs are still marked by the public reply"
          }
          dm_fast() {   # the newest 100 posts every 15 s: one call unless a comment count moved (dm_reply DM_FAST)
            DM_FAST=1 DM_RECENT_POSTS=100 timeout 60 python dm/dm_reply.py > /tmp/dmf.log 2>&1 || true
            DM_BRAND=AR_ DM_FAST=1 DM_RECENT_POSTS=100 timeout 60 python dm/dm_reply.py >> /tmp/dmf.log 2>&1 || true
            git diff --quiet -- state/dms.json state/dms_ar.json && return 0
            cat /tmp/dmf.log
            git add state/dms.json 2>/dev/null || true
            git add state/dms_ar.json 2>/dev/null || true
            git diff --staged --quiet && return 0
            git commit -q -m "dms: $(date -u +%FT%TZ)"
            for k in 1 2 3; do
              git pull -q --rebase --autostash && git push -q && return 0
              git rebase --abort 2>/dev/null || true; sleep 3
            done
            echo "::warning::dms.json push failed - sent DMs are still marked by the public reply"
          }
          for i in $(seq 1 17); do
            start=$SECONDS
            gh workflow run post.yml -f dry_run=false || echo "dispatch $i failed - next one in 20 min"
            # GitHub's own timer skipped every cadence run and a TikTok-stats run (17 Oct
            # 2026); the heartbeat never sleeps through, so it carries them: cadence every
            # 2 h (the 4-6/day rule), TikTok stats once per heartbeat (~6 h).
            if [ $((i % 6)) -eq 1 ]; then gh workflow run cadence.yml || echo "cadence dispatch failed"; fi
            if [ "$i" -eq 1 ]; then gh workflow run tiktok_stats.yml || echo "stats dispatch failed"; fi
            # Kevin's new upload (29 Oct 2026): kevin_watch's hourly cron ran 3 times in 48 h, so a
            # Wednesday episode could wait past the afternoon planner. The heartbeat starts it hourly.
            if [ $((i % 3)) -eq 1 ]; then gh workflow run kevin_watch.yml || echo "kevin-watch dispatch failed"; fi
            dm_pass 100                             # the full sweep, once per 20 min (7 days of posts)
            n=0
            while [ $((SECONDS - start)) -lt 1050 ]; do
              sleep 5
              n=$((n + 1))
              # 12 Nov 2026, Kamay: "it needs to be instantly ... even 15 seconds is delayed". A fast
              # look every 5 s (one cheap call each); the ordinary pass (fresh checkout, Facebook,
              # anything a fast look failed on) about every 2.5 min. WB is instant because Meta's
              # own comment rule answers there; this is as close as a bot that has to look can get.
              if [ $((n % 25)) -eq 0 ]; then dm_pass 6; else dm_fast; fi
            done
            left=$((1200 - (SECONDS - start)))
            if [ $left -gt 0 ]; then sleep $left; fi   # never a failing last line under bash -e
          done
      - name: Hand over to the next heartbeat
        if: ${{ !cancelled() }}
        run: gh workflow run pulse.yml
