# THE CLOUD CLIP FACTORY - 19 Sept 2026. Clips get made with Kamay's Mac shut.
#   stock  - HD episodes from Rumble (encrypted) + transcripts. Runs beside the rest.
#   plan   - split pending clip plans into shards of 2 clips.
#   build  - one server per shard, all at once ("make sure its running fast").
#   queue  - the ONLY job that touches the posting queue: upload what passed, commit.
name: factory
on:
  workflow_dispatch:
  push:
    # MAIN ONLY. 23 Sept 2026: the planners push their plans to a claude/* branch,
    # which matched this path filter and started a factory run ON THAT BRANCH.
    # It built the clips, uploaded them, and then could not save the manifest -
    # the branch was deleted by the merge job while it worked. Two batches of
    # finished clips were lost that way before anyone noticed.
    branches: [main]
    paths: ["factory/plans/**"]
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: write
concurrency:
  group: factory
  cancel-in-progress: false
env:
  FACTORY_KEY: ${{ secrets.FACTORY_KEY }}
  TRANSCRIPT_KEY: ${{ secrets.TRANSCRIPT_KEY }}
  PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}          # cinematic openers (kt_opener.py)
  OPENER_LIVE: ${{ vars.OPENER_LIVE }}             # "on" after Kamay approves the first automatic one
  GH_TOKEN: ${{ github.token }}
jobs:
  stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash factory/setup.sh
      - name: Stock the month's HD episodes from Rumble (factory/source_plan.json first)
        run: |
          pip install -q -U "yt-dlp[default,curl-cffi]" curl_cffi
          # Kevin's newest uploads first enter the catalogue here (it ran only by hand
          # before 5 Oct, so nothing he posted after 30 Sept could be stocked).
          timeout 15m python factory/rumble_catalog.py || echo "catalogue refresh failed - using the one on disk"
          python factory/rumble_stock.py --max 16 --stock 20
      - name: Save the refreshed catalogue (vsc-factory matches its assignments against it)
        run: |
          git config user.name "kt-factory"
          git config user.email "kt-factory@users.noreply.github.com"
          git add factory/rumble_catalog.json
          git diff --staged --quiet && exit 0
          git commit -q -m "rumble catalogue refreshed $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done

  tlist:
    needs: stock
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.l.outputs.matrix }}
      count: ${{ steps.l.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: python factory/transcripts_index.py list

  transcribe:
    needs: tlist
    if: ${{ !cancelled() && needs.tlist.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        vid: ${{ fromJSON(needs.tlist.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash factory/setup.sh
      - name: Transcribe one episode (one server each, all at once)
        run: python factory/transcribe.py --only "${{ matrix.vid }}"

  tmark:
    needs: transcribe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record every finished transcript (single writer)
        run: python factory/transcripts_index.py mark
      - name: Transcripts readable by the planning agent
        run: python factory/rekey_transcripts.py

  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.s.outputs.matrix }}
      count: ${{ steps.s.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: s
        run: python factory/shard.py

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash factory/setup.sh
      - name: Render and check this shard
        run: python factory/build_shard.py "${{ matrix.plan }}" "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.plan }}-${{ matrix.shard }}
          path: /tmp/shard_out
          retention-days: 7

  queue:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # MAIN AS IT IS NOW, not the commit that started the run (14 Oct 2026). A run
      # that waited behind another factory run otherwise merged its clips into the
      # kt_series.json of hours before, and the save collided with the newer one.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash factory/setup.sh
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: /tmp/shards }
      - name: Queue every clip that passed
        run: |
          git config user.name "kt-factory"
          git config user.email "kt-factory@users.noreply.github.com"
          python factory/queue.py /tmp/shards
      - name: Save
        run: |
          # Never commit a JSON file that does not parse: one broken kt_series.json
          # (conflict markers, 14 Oct 2026) stopped every factory run for both accounts.
          for f in $(git ls-files -m -o --exclude-standard state docs factory | grep '\.json$'); do
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f" || { echo "REFUSED: $f is not valid JSON"; exit 1; }
          done
          git add -A state docs factory
          git diff --staged --quiet || git commit -q -m "factory: clips built and queued $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
