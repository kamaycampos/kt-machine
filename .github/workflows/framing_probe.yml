# Proves a framing rule on real footage before it goes live: contact sheets of
# the old crop (biggest face) beside the new one (who is speaking). Manual only.
name: framing-probe
on:
  workflow_dispatch:
    inputs:
      series:
        description: "kt_series.json key"
        default: "success_code"
      clips:
        description: "how many clips"
        default: "6"
permissions:
  contents: write
env:
  FACTORY_KEY: ${{ secrets.FACTORY_KEY }}
  GH_TOKEN: ${{ github.token }}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with: { path: ~/wcache, key: whisper-2ca53bb-small-en-v2-portable }
      - run: bash factory/setup.sh
      - run: python factory/framing_probe.py "${{ inputs.series }}" "${{ inputs.clips }}"
      # Artifacts live in blob storage the Connector's network cannot reach; a
      # prerelease on this repo is readable from anywhere, so the sheets go there too.
      - name: Publish the sheets to the framing-probe prerelease
        if: always()
        run: |
          gh release view framing-probe >/dev/null 2>&1 || \
            gh release create framing-probe --prerelease --title "framing probe" --notes "old vs new crop contact sheets"
          # a plan probe ("plan:factory/probe_plans/x.json") also leaves its
          # caption evidence: what was burned, what whisper heard, the verdicts
          tag=$(echo "${{ inputs.series }}" | sed 's#^plan:##; s#.*/##; s#\.json$##; s#[^A-Za-z0-9_-]#_#g')
          mkdir -p /tmp/pub
          for f in /tmp/probe/*.jpg /tmp/probe/*.json /tmp/probe/*.md; do
            [ -f "$f" ] && cp "$f" "/tmp/pub/${tag}__$(basename "$f")"
          done
          ls /tmp/pub/* >/dev/null 2>&1 && gh release upload framing-probe /tmp/pub/* --clobber || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framing-probe
          path: /tmp/probe/*.j*
          retention-days: 7
