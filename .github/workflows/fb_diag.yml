# READ-ONLY (3 Nov 2026): what the DM bot sees on Awakened Rise's Facebook Page. Sends nothing.
name: fb-diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DM_BRAND: AR_
      AR_CTA_KEYWORDS: ${{ secrets.AR_CTA_KEYWORDS }}
      AR_FB_PAGE_ID: ${{ secrets.AR_FB_PAGE_ID }}
      AR_FB_ACCESS_TOKEN: ${{ secrets.AR_FB_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests && python dm/fb_diag.py 29014605581515205 1059657373628249
