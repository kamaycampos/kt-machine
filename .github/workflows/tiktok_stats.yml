# TikTok numbers every 6 hours -> state/tiktok.json (22 Sept 2026).
name: tiktok-stats
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read TikTok numbers
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          FACTORY_KEY: ${{ secrets.FACTORY_KEY }}
          GH_TOKEN: ${{ github.token }}
          KT_DATA: state
        run: python tiktok_stats.py
      - name: Save
        run: |
          git config user.name "kt-machine"; git config user.email "kt-machine@users.noreply.github.com"
          git add state/tiktok.json
          git diff --staged --quiet || git commit -q -m "tiktok stats $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
