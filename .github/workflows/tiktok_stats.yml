# TikTok numbers every 6 hours -> state/tiktok.json (22 Sept 2026).
name: tiktok-stats
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read TikTok numbers
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}   # the posting key = the account the clips go to
          FACTORY_KEY: ${{ secrets.FACTORY_KEY }}
          GH_TOKEN: ${{ github.token }}
          KT_DATA: state
        run: python tiktok_stats.py
      - name: Copy Lab - which words made people act (factory/reports/copy_lab.md)
        continue-on-error: true
        run: python factory/copy_lab.py > /dev/null
      - name: Save
        run: |
          git config user.name "kt-machine"; git config user.email "kt-machine@users.noreply.github.com"
          git add state/tiktok.json state/tiktok_history*.json factory/reports/copy_lab.md
          git diff --staged --quiet || git commit -q -m "tiktok stats $(date -u +%FT%TZ)"
          bash factory/save_state.sh
