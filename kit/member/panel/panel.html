<!doctype html>
<html lang="en" data-app="factory-panel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a control room. A sticky bar of six rooms; each room is one job (see, check, change). */
:root{
  --bg:#f3f2ee; --surface:#fff; --ink:#16161a; --muted:#5d5c64; --line:#dddbd4;
  --accent:#a8740a; --good:#1f7a4a; --warn:#a86a00; --bad:#b3261e; --chip:#ecebe6;
  --display:"Montserrat","Arial Black",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121216; --surface:#1b1b21; --ink:#f1f0ec; --muted:#a3a2ab; --line:#2e2e36;
  --accent:#ffd400; --good:#4cc38a; --warn:#f0b43c; --bad:#ff6b5e; --chip:#26262e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--body);padding-inline:16px;padding-block:0 60px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
main{display:grid;gap:28px;min-width:0}
main>section{min-width:0}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px);font-weight:900}
h2{font-size:22px;font-weight:900}
h3{font-size:14px;font-weight:700;letter-spacing:.03em}
.gold{color:var(--accent)}
.label{font:500 12px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:3px}
button,.btn{font:700 13px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);padding:10px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.primary{background:var(--ink);color:var(--bg)}
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:14px 0;display:grid;gap:12px}
.toprow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;white-space:nowrap}
nav button[aria-selected="true"]{border-bottom-color:var(--accent)}
.live{display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--surface);padding:16px;display:grid;gap:4px}
.tile b{font:900 28px/1 var(--display);font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px}
.card img,.card .noimg{width:96px;aspect-ratio:9/16;object-fit:cover;background:var(--chip);border-radius:4px;max-width:100%}
.card .meta{display:grid;gap:6px;align-content:start;min-width:0;overflow-wrap:anywhere}
.card .hook{font:900 15px/1.15 var(--display);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 11px/1 var(--mono);padding:5px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.bad{color:var(--bad)}
.nums{font:500 12px/1.5 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.small{font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input[type=text],input[type=search],select{font:15px var(--body);padding:9px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0}
.list{display:grid;border:1px solid var(--line);background:var(--surface)}
.item{overflow-wrap:anywhere;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start}
.preview{aspect-ratio:9/16;max-width:270px;width:100%;border-radius:18px;position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 35%,#5a4a3a,#2a2420 45%,#0c0b0d)}
.preview .h{position:absolute;left:8%;right:8%;top:48%;text-align:center;font:900 22px/1.05 var(--display)}
.preview .c{position:absolute;left:8%;right:8%;top:62%;text-align:center;font:900 24px/1 var(--display)}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px}
pre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:var(--surface);border:1px solid var(--line);padding:14px;margin:0;overflow-x:auto;max-height:420px}
.empty{border:1.5px dashed var(--line);padding:24px;display:grid;gap:8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:6px;font:700 13px var(--display);text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <h1>My <span class="gold">Factory</span></h1>
      <span class="label live"><span class="dot" id="dot"></span><span id="fresh"></span></span>
    </div>
    <nav role="tablist" id="tabs"></nav>
  </header>
  <main id="room"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.repo, GH = 'https://github.com/' + R;
const edit = p => `${GH}/edit/main/${p}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n == null ? '–' : Number(n).toLocaleString();
const when = t => t ? new Date(t.replace(' ', 'T')).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1800); };
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label || 'Copied'); }
  catch { const a = document.createElement('textarea'); a.value = text; document.body.append(a); a.select(); try { document.execCommand('copy'); toast(label || 'Copied'); } catch {} a.remove(); }
}
const say = (text, label = 'Tell Claude') => `<button data-copy="${esc(text)}" data-label="Copied. Paste it to your Claude" title="Copies: ${esc(text)}">${esc(label)}</button>`;

function statusChips(c) {
  const order = ['instagram', 'facebook', 'youtube', 'tiktok'];
  const s = c.status || {}, out = [];
  for (const p of order) {
    const v = String(s[p] || ''); if (!v) continue;
    let k = 'bad', t = 'failed';
    if (v === 'posted') { k = 'good'; t = 'live'; }
    else if (/inbox|draft/i.test(v)) { k = 'warn'; t = 'in drafts'; }
    else if (/not configured/i.test(v)) { k = ''; t = 'not connected'; }
    else if (/skipped/i.test(v)) { k = ''; t = 'skipped'; }
    out.push(`<span class="chip ${k}" title="${esc(v)}">${({instagram:'IG',facebook:'FB',youtube:'YT',tiktok:'TT'})[p]} · ${t}</span>`);
  }
  if (!c.posted && !c.retired) out.unshift(`<span class="chip warn">${c.scheduled ? 'scheduled ' + when(c.scheduled) : 'waiting for a slot'}</span>`);
  if (c.retired) out.unshift('<span class="chip">retired</span>');
  return out.join('');
}

function clipCard(c) {
  const v = c.views, total = (v.instagram||0) + (v.youtube||0) + (v.tiktok||0);
  const links = Object.entries(c.links || {}).filter(([,u]) => String(u).startsWith('http'))
    .map(([p,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${p}</a>`).join(' · ');
  const src = c.source || {};
  const range = src.in != null ? ` · ${Math.floor(src.in/60)}:${String(Math.round(src.in%60)).padStart(2,'0')}–${Math.floor(src.out/60)}:${String(Math.round(src.out%60)).padStart(2,'0')}` : '';
  return `<article class="card">
    ${c.thumb ? `<img src="${c.thumb}" alt="" loading="lazy">` : '<div class="noimg"></div>'}
    <div class="meta">
      <div class="hook">${esc(c.hook)}</div>
      <div class="chips">${statusChips(c)}</div>
      <div class="nums">${total ? `${fmt(total)} views` : ''}${c.skip != null ? ` · skip ${c.skip}%` : ''}${c.watch ? ` · ${c.watch}s watched` : ''}${c.saves != null ? ` · ${fmt(c.saves)} saves` : ''}</div>
      <div class="small">From <a href="${esc(src.url || '#')}" target="_blank" rel="noopener">${esc(src.title || 'source')}</a>${range}</div>
      <div class="row small"><a href="${esc(c.media)}" target="_blank" rel="noopener">Watch</a>${links ? ' · ' + links : ''}</div>
      <div class="row"><button data-copy="${esc(c.caption)}" data-label="Caption copied">Copy caption</button>
        ${say(`Look at my clip "${c.hook}" (${c.file}) and tell me how to make the next one stronger.`, 'Improve the next one')}</div>
    </div></article>`;
}

const rooms = {
  Home() {
    const s = D.summary, next = D.clips.filter(c => !c.posted && !c.retired).sort((a,b) => (a.scheduled||'~').localeCompare(b.scheduled||'~')).slice(0, 4);
    const top = D.clips.filter(c => c.posted).map(c => [c, (c.views.instagram||0)+(c.views.youtube||0)+(c.views.tiktok||0)]).sort((a,b) => b[1]-a[1]).slice(0, 4).map(x => x[0]);
    const skipNote = s.skip == null ? 'appears once Instagram reports' : (s.skip <= 40 ? 'under the 40% target' : 'target: under 40%');
    return `<section class="tiles">
      <div class="tile"><span class="label">Clips made</span><b>${fmt(s.made)}</b><small>${fmt(s.pending)} waiting to post</small></div>
      <div class="tile"><span class="label">Posted</span><b>${fmt(s.posted)}</b><small>across your platforms</small></div>
      <div class="tile"><span class="label">Views</span><b>${fmt(s.views)}</b><small>Instagram + YouTube + TikTok</small></div>
      <div class="tile"><span class="label">Skip rate</span><b>${s.skip == null ? '–' : s.skip + '%'}</b><small>${skipNote}</small></div>
      <div class="tile"><span class="label">TikTok followers</span><b>${fmt(s.followers)}</b><small>updated every 6 hours</small></div>
    </section>
    ${D.clips.length ? `
    <section style="display:grid;gap:14px"><h2>Up <span class="gold">next</span></h2>
      ${next.length ? `<div class="grid">${next.map(clipCard).join('')}</div>` : '<p class="small">Nothing waiting. Type <b>plan</b> in Claude to choose this week\'s clips.</p>'}</section>
    ${top.length ? `<section style="display:grid;gap:14px"><h2>Your <span class="gold">best</span></h2><div class="grid">${top.map(clipCard).join('')}</div></section>` : ''}`
    : `<section class="empty"><h3>Your first clips are on the way</h3>
       <p>Open Claude and type <b>plan</b> once your first episodes are transcribed. That takes 1-3 hours after setup. This page fills itself in as clips are made and posted.</p>
       <div class="row"><a class="btn primary" href="https://claude.ai/code" target="_blank" rel="noopener">Open Claude</a><a class="btn" href="${GH}/actions" target="_blank" rel="noopener">See the factory working</a></div></section>`}`;
  },
  Clips() {
    return `<section style="display:grid;gap:14px">
      <div class="row" style="justify-content:space-between"><h2>All <span class="gold">clips</span></h2>
        <a class="btn" href="captions.html">Captions board</a></div>
      <div class="filters" id="f">${['All','Waiting','Live','Needs attention'].map((x,i) => `<button aria-pressed="${i===0}" data-f="${x}">${x}</button>`).join('')}
        <input type="search" id="q" placeholder="Search hooks and captions" aria-label="Search clips"></div>
      <div class="grid" id="cl"></div></section>`;
  },
  Money() {
    const s = D.summary, m = D.dms || {};
    if (!D.money_enc) return `<section style="display:grid;gap:14px"><h2>Your <span class="gold">money</span></h2>
      <div class="empty"><h3>Nothing recorded yet</h3><p>Your Claude reads your affiliate portal in your own browser (clicks, sales and commission for each brand) and records it here, <b>encrypted</b>. Your repository is public, so only you, with your passphrase, can open it.</p>
      <div class="row">${say('money: read my affiliate portal and record my numbers', 'Record my numbers')}</div></div></section>`;
    return `<section style="display:grid;gap:14px"><h2>Your <span class="gold">money</span></h2>
      <p class="small">Encrypted in your public repository. Your passphrase unlocks it here, in this browser only. It is never sent anywhere.</p>
      <form class="row" id="mf"><input type="password" id="mp" placeholder="Money passphrase" aria-label="Money passphrase" autocomplete="current-password"><button class="btn primary" type="submit">Unlock</button></form>
      <div id="mo"></div>
      <div class="row">${say('money: read my affiliate portal and record my numbers', 'Record my latest numbers')}
        ${say('Which hooks and keywords are bringing the most clicks and sales? Plan more of those.', 'Plan from my money')}</div></section>`;
  },
  Messages() {
    const m = D.dms || {total:0, week:0, keywords:[], errors:[]};
    return `<section style="display:grid;gap:14px">
      <h2>Comment <span class="gold">→ DM</span></h2>
      <p class="small">When someone comments your keyword on Instagram or Facebook, the factory sends them your link in a private message within 20 minutes, with your disclosure. Nobody is messaged twice.</p>
      <section class="tiles">
        <div class="tile"><span class="label">Links sent</span><b>${fmt(m.total)}</b><small>all time</small></div>
        <div class="tile"><span class="label">This week</span><b>${fmt(m.week)}</b><small>last 7 days</small></div>
        <div class="tile"><span class="label">Best keyword</span><b>${esc((m.keywords[0]||{}).keyword || '–')}</b><small>${m.keywords[0] && m.keywords[0].per_1k != null ? m.keywords[0].per_1k + ' DMs per 1,000 views' : 'measured as comments arrive'}</small></div>
      </section>
      ${m.keywords.length ? `<div class="list">${m.keywords.map(k => `<div class="item"><div><b>${esc(k.keyword)}</b><div class="nums">${fmt(k.instagram)} Instagram · ${fmt(k.facebook)} Facebook${k.per_1k != null ? ` · ${k.per_1k} per 1,000 views` : ''}</div></div><span class="chip good">${fmt(k.dms)} sent</span></div>`).join('')}</div>`
        : `<div class="empty"><h3>${m.on ? 'Listening for your keyword' : 'Switch it on in one sentence'}</h3><p>${m.on ? 'The first DMs show up here as soon as someone comments your keyword.' : 'Type <b>post</b> in Claude. It connects Instagram and Facebook and turns comment → DM on for you.'}</p></div>`}
      ${(m.errors||[]).length ? `<h3>Last problems</h3><div class="list">${m.errors.map(e => `<div class="item"><div class="nums">${esc(e.platform)} · ${esc(e.error)}</div></div>`).join('')}</div>` : ''}
      <div class="row">${say('Which DM keyword is working best for me, and what should I try next?', 'Ask which keyword wins')}
        ${say('Change my DM message to: ', 'Change my DM message')}
        <a class="btn" href="${GH}/settings/variables/actions" target="_blank" rel="noopener">DM settings</a></div></section>`;
  },
  Sources() {
    const s = D.sources;
    return `<section style="display:grid;gap:14px">
      <h2>Where your clips <span class="gold">come from</span></h2>
      <p class="small">These are this month's episodes. The factory downloads them in HD, transcribes them, and your Claude picks the moments. You can add, remove or reorder any of them.</p>
      <div class="row"><a class="btn primary" href="${edit('factory/source_plan.json')}" target="_blank" rel="noopener">Edit my sources</a>
        ${say('Add this episode to my sources and plan clips from it: ', 'Add an episode')}
        ${say('Find me the 5 best new Kevin Trudeau episodes for my lane and add them to my sources.', 'Find me 5 episodes')}</div>
      ${s.length ? `<div class="list">${s.map(e => `<div class="item"><div><a href="${esc(e.url || '#')}" target="_blank" rel="noopener">${esc(e.title)}</a><div class="nums">${esc(e.id)}</div></div>
        <span class="chip ${e.planned ? 'good' : 'warn'}">${e.planned ? 'clipped' : 'waiting'}</span></div>`).join('')}</div>`
      : '<div class="empty"><h3>No sources chosen yet</h3><p>Type <b>plan</b> in Claude and it picks the best episodes for your lane, or add your own with the buttons above.</p></div>'}
      <p class="small muted">Use only footage the affiliate program authorises. See <a href="${GH}/blob/main/playbook/COMPLIANCE.md" target="_blank" rel="noopener">Compliance</a>.</p></section>`;
  },
  Style() {
    const st = Object.assign({accent_color:'#FFE500', text_color:'white', shadow:'heavy', uppercase:true, hook_seconds:4.5, caption_size:72, hook_size:92}, D.style);
    return `<section class="two">
      <div style="display:grid;gap:14px">
        <h2>Your <span class="gold">look</span></h2>
        <p class="small">Change any of these to see your clip update here. When you like it, copy the style and paste it into your style file. Every clip from then on renders this way.</p>
        <div class="form">
          <label><span class="label">Accent colour (payoff line, numbers)</span><input type="color" id="s_accent" value="${/^#/.test(st.accent_color) ? st.accent_color : '#FFE500'}"></label>
          <label><span class="label">Text colour</span><input type="color" id="s_text" value="${/^#/.test(st.text_color) ? st.text_color : '#FFFFFF'}"></label>
          <label><span class="label">Shadow</span><select id="s_shadow">${['heavy','soft','outline','none'].map(x => `<option ${x===st.shadow?'selected':''}>${x}</option>`).join('')}</select></label>
          <label><span class="label">Capitals</span><select id="s_upper"><option value="true" ${st.uppercase?'selected':''}>ALL CAPS</option><option value="false" ${!st.uppercase?'selected':''}>Normal case</option></select></label>
          <label><span class="label">Hook stays on screen (seconds)</span><input type="text" id="s_secs" inputmode="decimal" value="${st.hook_seconds}"></label>
        </div>
        <div class="row"><button class="btn primary" id="s_copy">Copy my style</button>
          <a class="btn" href="${edit('my_brand/style.json')}" target="_blank" rel="noopener">Open style file</a>
          ${say('style: ', 'Describe a look to Claude')}</div>
        <p class="small">You can also ask for anything not listed: your own font, a new motion, a sound under the hook, a different layout. Type <b>style</b> in Claude and describe it.</p>
      </div>
      <div class="preview" id="pv" aria-label="Preview of your hook and caption"><div class="h" id="pv_h">How rich people<br><span>actually buy houses</span></div><div class="c" id="pv_c">$40</div></div>
    </section>`;
  },
  Brand() {
    return `<section style="display:grid;gap:14px">
      <h2>Your <span class="gold">voice</span></h2>
      <p class="small">Your Claude reads this before every clip it chooses. Change it here and the next <b>plan</b> follows it.</p>
      <div class="row"><a class="btn primary" href="${edit('my_brand/BRAND.md')}" target="_blank" rel="noopener">Edit my brand</a>
        <a class="btn" href="${edit('my_brand/EXAMPLES.md')}" target="_blank" rel="noopener">Add examples I love</a>
        ${say('Here is a reel I love. Learn from it for my next plan: ', 'Teach it a reel')}</div>
      <pre>${esc(D.brand || 'Not written yet. Type start in Claude.')}</pre>
      ${D.report ? `<h3>Latest factory report</h3><pre>${esc(D.report)}</pre>` : ''}</section>`;
  },
  Updates() {
    const k = D.kit || {};
    return `<section style="display:grid;gap:14px">
      <h2>Updates &amp; <span class="gold">help</span></h2>
      <div class="list">
        <div class="item"><div><b>Your kit</b><div class="nums">version ${esc(k.version || '1.0.0')}</div></div><span class="chip" id="up">checking…</span></div>
        <div class="item"><div><b>Problems the factory reported</b><div class="nums" id="iss">checking…</div></div><a class="btn" href="${GH}/issues" target="_blank" rel="noopener">Open</a></div>
        <div class="item"><div><b>The factory running right now</b><div class="nums">stocking, transcribing, building, posting</div></div><a class="btn" href="${GH}/actions" target="_blank" rel="noopener">Watch</a></div>
      </div>
      <div id="changes"></div>
      <div class="row"><a class="btn" href="${GH}/issues/new" target="_blank" rel="noopener">Report a problem</a>
        ${say('update: bring my factory up to the newest kit version, keep my brand, style and clips.', 'Update my factory')}
        ${say('What new things can my factory do that I am not using yet?', 'What am I not using?')}</div></section>`;
  },
};

const order = Object.keys(rooms);
let current = (location.hash || '').slice(1);
if (!order.includes(current)) current = 'Home';
function show(name) {
  current = name;
  document.getElementById('tabs').innerHTML = order.map(n => `<button role="tab" aria-selected="${n===name}" data-room="${n}">${n}</button>`).join('');
  document.getElementById('room').innerHTML = rooms[name]();
  if (name === 'Clips') clipsWire();
  if (name === 'Style') styleWire();
  if (name === 'Updates') updatesWire();
  if (name === 'Money') moneyWire();
  history.replaceState(null, '', '#' + name);
}
function clipsWire() {
  let f = 'All';
  const draw = () => {
    const q = (document.getElementById('q').value || '').toLowerCase();
    const list = D.clips.filter(c => {
      const bad = Object.values(c.status||{}).some(v => v && !/posted|inbox|draft|not configured|skipped/i.test(String(v)));
      if (f === 'Waiting' && (c.posted || c.retired)) return false;
      if (f === 'Live' && !c.posted) return false;
      if (f === 'Needs attention' && !bad) return false;
      return !q || (c.hook + ' ' + c.caption).toLowerCase().includes(q);
    });
    document.getElementById('cl').innerHTML = list.length ? list.map(clipCard).join('') : '<div class="empty">No clips here yet.</div>';
  };
  document.getElementById('f').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; f = b.dataset.f;
    document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  document.getElementById('q').addEventListener('input', draw); draw();
}
function styleWire() {
  const g = id => document.getElementById(id);
  const shadows = {heavy:'0 5px 8px rgba(0,0,0,.85)', soft:'0 4px 8px rgba(0,0,0,.55)', outline:'0 0 6px #000, 0 0 2px #000', none:'none'};
  const cur = () => ({accent_color:g('s_accent').value.toUpperCase(), text_color:g('s_text').value.toUpperCase(), shadow:g('s_shadow').value,
    uppercase:g('s_upper').value === 'true', hook_seconds:parseFloat(g('s_secs').value) || 4.5});
  const paint = () => { const s = cur(), h = g('pv_h'), c = g('pv_c');
    [h, c].forEach(el => { el.style.color = s.text_color; el.style.textShadow = shadows[s.shadow]; el.style.textTransform = s.uppercase ? 'uppercase' : 'none'; });
    h.querySelector('span').style.color = s.accent_color; c.style.color = s.accent_color; };
  ['s_accent','s_text','s_shadow','s_upper','s_secs'].forEach(id => g(id).addEventListener('input', paint));
  g('s_copy').addEventListener('click', () => copy(JSON.stringify(Object.assign({}, D.style, cur()), null, 1), 'Style copied. Paste it into your style file'));
  paint();
}
async function openMoney(pass) {
  const b = Uint8Array.from(atob(D.money_enc), c => c.charCodeAt(0));
  const salt = b.slice(8, 16), ct = b.slice(16);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv:bits.slice(32, 48)}, key, ct)));
}
function moneyWire() {
  const f = document.getElementById('mf'); if (!f) return;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const out = document.getElementById('mo');
    try {
      const d = await openMoney(document.getElementById('mp').value);
      const rows = d.entries || [], sum = k => rows.reduce((a, r) => a + (Number(r[k]) || 0), 0);
      const brands = {}; rows.forEach(r => { const b = brands[r.brand] ||= {clicks:0, sales:0, commission:0};
        b.clicks += Number(r.clicks)||0; b.sales += Number(r.sales)||0; b.commission += Number(r.commission)||0; });
      const dm = D.dms || {}, v = D.summary.views;
      out.innerHTML = `<section class="tiles">
        <div class="tile"><span class="label">Views</span><b>${fmt(v)}</b><small>all platforms</small></div>
        <div class="tile"><span class="label">Links by DM</span><b>${fmt(dm.total)}</b><small>comment → DM</small></div>
        <div class="tile"><span class="label">Clicks</span><b>${fmt(sum('clicks'))}</b><small>from your portal</small></div>
        <div class="tile"><span class="label">Sales</span><b>${fmt(sum('sales'))}</b><small>${sum('clicks') ? (100*sum('sales')/sum('clicks')).toFixed(1) + '% of clicks' : ''}</small></div>
        <div class="tile"><span class="label">Commission</span><b>$${sum('commission').toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}</b><small>30% of every sale</small></div></section>
        <div class="list">${Object.entries(brands).sort((a,b) => b[1].commission - a[1].commission).map(([b, x]) => `<div class="item"><div><b>${esc(b)}</b><div class="nums">${fmt(x.clicks)} clicks · ${fmt(x.sales)} sales</div></div><span class="chip good">$${x.commission.toFixed(2)}</span></div>`).join('')}</div>
        <p class="nums">Last recorded ${esc((rows[rows.length-1]||{}).date || '')}</p>`;
    } catch { out.innerHTML = '<p class="small" style="color:var(--bad)">That passphrase did not open it. Try again.</p>'; }
  });
}
async function updatesWire() {
  const k = D.kit || {}, up = document.getElementById('up');
  try {
    if (!k.upstream) throw 0;
    const r = await fetch(`https://raw.githubusercontent.com/${k.upstream}/main/KIT.json`, {cache:'no-store'});
    const u = await r.json();
    const newer = (u.version || '') > (k.version || '');
    up.textContent = newer ? `update ${u.version} ready` : 'up to date';
    up.className = 'chip ' + (newer ? 'warn' : 'good');
    if (newer && u.changes) document.getElementById('changes').innerHTML = `<h3>What's new in ${esc(u.version)}</h3><ul>${u.changes.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p class="small">Type <b>update</b> in Claude to get it. Your brand, style and clips stay as they are.</p>`;
  } catch { up.textContent = 'could not check'; up.className = 'chip'; }
  try {
    const r = await fetch(`https://api.github.com/repos/${R}/issues?state=open&per_page=20`);
    const a = (await r.json()).filter(i => !i.pull_request);
    document.getElementById('iss').textContent = a.length ? `${a.length} open: ${a.slice(0,2).map(i => i.title).join(' · ')}` : 'none open';
  } catch { document.getElementById('iss').textContent = 'could not check'; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-room]'); if (t) { show(t.dataset.room); return; }
  const c = e.target.closest('[data-copy]'); if (c) copy(c.dataset.copy, c.dataset.label);
});
// LIVE: the factory rewrites this page on every run. When a newer one is published, reload into it.
const builtAt = new Date(D.built.replace('Z', ':00Z'));
function fresh() { const m = Math.max(0, Math.round((Date.now() - builtAt) / 60000));
  document.getElementById('fresh').textContent = m < 60 ? `updated ${m} min ago` : `updated ${when(D.built)}`;
  document.getElementById('dot').style.background = m < 90 ? 'var(--good)' : 'var(--warn)'; }
async function poll() {
  try { const r = await fetch(location.pathname + '?t=' + Date.now(), {cache:'no-store'}); const t = await r.text();
    const m = t.match(/"built": "([^"]+)"/); if (m && m[1] !== D.built) location.reload(); } catch {}
}
fresh(); setInterval(fresh, 60000); setInterval(poll, 300000);
show(current);
